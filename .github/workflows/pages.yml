name: Déployer la frise sur GitHub Pages

# Utile uniquement si la source de GitHub Pages est réglée sur « GitHub Actions ».
# Si elle est réglée sur « Deploy from a branch » (branche + dossier /docs),
# ce workflow n'est pas nécessaire : GitHub publie le dossier tout seul.

on:
  push:
    branches:
      - claude/inventions-timeline-app-q2is2u
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
